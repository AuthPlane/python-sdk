name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Least-privilege default; this workflow only reads the repo.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        package:
          - root
          - authplane-mcp
          - authplane-fastmcp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # AuthPlane/conformance is the public sibling repo carrying the shared
      # oauth-sdk-conformance-catalog.yaml, pinned by SHA in the tracked
      # .conformance-catalog-ref (read from the checked-out workspace, so the
      # Checkout step above must precede this one).
      #
      # The read/guard/fetch sequence lives in the script rather than inline
      # here: release.yml and the drift workflow need the same three lines, and
      # inline in each the 40-hex-SHA guard could be tightened in one copy and
      # not the others. The script clones to $RUNNER_TEMP — outside
      # $GITHUB_WORKSPACE — so the catalog stays out of the working tree.
      - name: Clone shared conformance catalog (out of tree)
        if: matrix.package == 'root'
        run: .github/scripts/fetch-conformance-catalog.sh

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Install package dependencies
        run: |
          if [ "${{ matrix.package }}" = "root" ]; then
            pip install -e ".[dev]"
          else
            # Adapters depend on authplane; install local SDK package first.
            pip install -e .
            pip install -e "${{ matrix.package }}[dev]"
          fi

      - name: Ruff check
        run: |
          if [ "${{ matrix.package }}" = "root" ]; then
            ruff check .
          else
            ruff check "${{ matrix.package }}"
          fi

      - name: Ruff format check
        run: |
          if [ "${{ matrix.package }}" = "root" ]; then
            ruff format --check .
          else
            ruff format --check "${{ matrix.package }}"
          fi

      - name: Pyright (SDK only)
        if: matrix.package == 'root'
        run: pyright

      - name: Test and coverage
        env:
          AUTHPLANE_CONFORMANCE_CATALOG: ${{ runner.temp }}/conformance/oauth-sdk-conformance-catalog.yaml
        run: |
          if [ "${{ matrix.package }}" = "root" ]; then
            coverage run -m pytest tests conformance-tests && coverage report
          else
            cd "${{ matrix.package }}"
            coverage run -m pytest tests && coverage report
          fi

      - name: Build package artifacts
        run: |
          if [ "${{ matrix.package }}" = "root" ]; then
            python -m build
          else
            cd "${{ matrix.package }}"
            python -m build
          fi

      - name: Validate package metadata
        run: |
          if [ "${{ matrix.package }}" = "root" ]; then
            twine check dist/*
          else
            twine check "${{ matrix.package }}/dist/*"
          fi
